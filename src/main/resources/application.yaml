spring:
  application:
    name: ecommerce
  # Perfil de Spring para el adaptador de persistencia (opciones: 'h2' o 'memory')
  # Por defecto si no se especifica se usará 'h2' (o 'default')
  profiles:
    active: h2
  datasource:
    url: jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# Configuración personalizada de repositorio (Opcional - alternativa a Spring Profiles)
# catalog:
#   repository:
#     type: h2 # o 'memory'

server:
  port: 8080